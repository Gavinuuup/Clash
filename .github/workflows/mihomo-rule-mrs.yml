name: Convert Mihomo Rules to MRS

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "mihomo/rule/**/*.yaml"
      - "mihomo/rule/**/*.yml"
      - "mihomo/rule/**/*.txt"
      - "mihomo/rule/**/*.list"

  workflow_dispatch:

env:
  MIHOMO_VERSION: v1.19.29

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download mihomo
        run: |
          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz

          gzip -dc mihomo.gz > mihomocore
          chmod +x mihomocore

          ./mihomocore -v

      - name: Convert all rules to mrs
        run: |
          set -e

          RULE_DIR="mihomo/rule"

          find "$RULE_DIR" -type f \
            \( -name "*.yaml" -o -name "*.yml" -o -name "*.txt" -o -name "*.list" \) \
            -print0 |
          while IFS= read -r -d '' file; do

            base="${file%.*}"
            out="${base}.mrs"

            fname_lower=$(basename "$file" | tr '[:upper:]' '[:lower:]')

            # 判断规则类型
            # 文件名包含 ip / ipcidr -> ipcidr
            # 文件名包含 domain / domains -> domain
            if [[ "$fname_lower" == *ipcidr* || "$fname_lower" == *ip* ]]; then
              rtype="ipcidr"
            elif [[ "$fname_lower" == *domains* || "$fname_lower" == *domain* ]]; then
              rtype="domain"
            else
              echo "ERROR: Cannot determine rule type for: $file"
              echo "Please make sure the filename contains domain or ip/ipcidr."
              exit 1
            fi

            # 判断输入格式
            case "$file" in
              *.txt|*.list)
                informat="text"
                ;;
              *.yaml|*.yml)
                informat="yaml"
                ;;
              *)
                echo "ERROR: Unsupported file format: $file"
                exit 1
                ;;
            esac

            echo "========================================"
            echo "Processing: $file"
            echo "Type:       $rtype"
            echo "Format:     $informat"
            echo "Output:     $out"
            echo "========================================"

            # 使用临时文件作为输入，避免输入输出文件路径问题
            tmp_in="/tmp/$(basename "$file")"
            cp "$file" "$tmp_in"

            ./mihomocore convert-ruleset \
              "$rtype" \
              "$informat" \
              "$tmp_in" \
              "$out"

            rm -f "$tmp_in"

          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mihomo/rule/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto convert rules to MRS [skip ci]"
          git push

      - name: Cleanup
        if: always()
        run: |
          rm -f mihomo.gz
          rm -f mihomocore
