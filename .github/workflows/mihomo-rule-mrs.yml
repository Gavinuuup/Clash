name: Convert Mihomo Rules to MRS

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "mihomo/rule/domain/**/*.yaml"
      - "mihomo/rule/domain/**/*.yml"
      - "mihomo/rule/domain/**/*.txt"
      - "mihomo/rule/domain/**/*.list"
      - "mihomo/rule/ip/**/*.yaml"
      - "mihomo/rule/ip/**/*.yml"
      - "mihomo/rule/ip/**/*.txt"
      - "mihomo/rule/ip/**/*.list"

  workflow_dispatch:

env:
  MIHOMO_VERSION: v1.19.29

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download mihomo
        run: |
          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz

          gzip -dc mihomo.gz > mihomocore
          chmod +x mihomocore

          ./mihomocore -v

      - name: Convert rules to mrs
        run: |
          set -euo pipefail

          RULE_DIR="mihomo/rule"
          DOMAIN_DIR="$RULE_DIR/domain"
          IP_DIR="$RULE_DIR/ip"

          # 处理函数：$1=目录  $2=规则类型
          process_dir() {
            local dir="$1"
            local rtype="$2"

            if [[ ! -d "$dir" ]]; then
              echo "目录不存在，跳过: $dir"
              return 0
            fi

            find "$dir" -type f \
              \( -name "*.yaml" -o -name "*.yml" -o -name "*.txt" -o -name "*.list" \) \
              -print0 |
            while IFS= read -r -d '' file; do

              base="${file%.*}"
              out="${base}.mrs"

              # 判断输入格式
              case "$file" in
                *.txt|*.list) informat="text" ;;
                *.yaml|*.yml) informat="yaml" ;;
                *)
                  echo "ERROR: Unsupported file format: $file"
                  exit 1
                  ;;
              esac

              echo "========================================"
              echo "Processing: $file"
              echo "Type:       $rtype"
              echo "Format:     $informat"
              echo "Output:     $out"
              echo "========================================"

              tmp_in="/tmp/$(basename "$file")"
              cp "$file" "$tmp_in"

              ./mihomocore convert-ruleset \
                "$rtype" \
                "$informat" \
                "$tmp_in" \
                "$out"

              rm -f "$tmp_in"
            done
          }

          echo "########## 处理 domain 规则 ##########"
          process_dir "$DOMAIN_DIR" "domain"

          echo "########## 处理 ip 规则 ##########"
          process_dir "$IP_DIR" "ipcidr"

          echo "########## 完成 ##########"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mihomo/rule/domain/ mihomo/rule/ip/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto convert rules to MRS [skip ci]"
          git push

      - name: Cleanup
        if: always()
        run: |
          rm -f mihomo.gz
          rm -f mihomocore
