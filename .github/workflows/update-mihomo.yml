name: Update Mihomo Rules

permissions:
  contents: write


on:

  schedule:
    # 每天北京时间凌晨2点运行
    # UTC 18:00
    - cron: "0 18 * * *"

  workflow_dispatch:


env:

  MIHOMO_VERSION: v1.19.29



jobs:

  update:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v5
      with:
        # 1. 跨仓库检出：直接拉取 Mihomo 仓库
        repository: Gavinuuup/Mihomo
        token: ${{ secrets.MIHOMO_PAT }}
        ref: main


    - name: Download mihomo

      run: |

        wget -O mihomo.gz \
        https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz


        gzip -dc mihomo.gz > mihomocore


        chmod +x mihomocore


        ./mihomocore -v



    - name: Download ChinaMax rules

      run: |

        wget -O ChinaMax_Domain.yaml \
        https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml


        wget -O ChinaMax_IP.yaml \
        https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.yaml



    - name: Convert Domain rules

      run: |

        mkdir -p rules


        ./mihomocore convert-ruleset \
        domain \
        yaml \
        ChinaMax_Domain.yaml \
        mihomo/rule/ChinaMax_Domain.mrs



    - name: Convert IP rules

      run: |

        # mkdir -p rules
        
        
        ./mihomocore convert-ruleset \
        ipcidr \
        yaml \
        ChinaMax_IP.yaml \
        mihomo/rule/ChinaMax_IP.mrs



    - name: Commit changes

      run: |

        git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


        git add rules/


        git diff --cached --quiet && exit 0


        # git commit -m "Update ChinaMax MRS"
        # UTC 时间
        # git commit -m "chore: 自动同步 ChinaMax MRS 规则 [$(date +'%Y-%m-%d %H:%M:%S')]"
        # 北京时间
        git commit -m "chore: 自动同步 ChinaMax MRS 规则 [$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')]"


        git push



    - name: Cleanup

      run: |

        rm -f mihomo.gz

        rm -f mihomocore

        rm -f ChinaMax_Domain.yaml

        rm -f ChinaMax_IP.yaml
