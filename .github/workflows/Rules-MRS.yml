name: Convert Rules to MRS

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "mihomo/rule/**/*.yaml"
      - "mihomo/rule/**/*.yml"
      - "mihomo/rule/**/*.txt"
      - "mihomo/rule/**/*.list"
  workflow_dispatch:

env:
  MIHOMO_VERSION: v1.19.29

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download mihomo
        run: |
          wget -O mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz
          gzip -dc mihomo.gz > mihomocore
          chmod +x mihomocore
          ./mihomocore -v

      - name: Convert all rules to mrs
        run: |
          set -e
          RULE_DIR="mihomo/rule"

          find "$RULE_DIR" -type f \( \
            -name "*.yaml" -o \
            -name "*.yml"  -o \
            -name "*.txt"  -o \
            -name "*.list" \
          \) | while read -r file; do

            base="${file%.*}"
            out="${base}.mrs"
            fname_lower=$(basename "$file" | tr '[:upper:]' '[:lower:]')

            # 判断规则类型：文件名包含 ip/ipcidr -> ipcidr，包含 domain -> domain
            if echo "$fname_lower" | grep -qE 'ip|ipcidr'; then
              rtype="ipcidr"
            elif echo "$fname_lower" | grep -qE 'domain|domains'; then
              rtype="domain"
            else
              echo "跳过（无法判断类型，请重命名含 domain 或 ip）: $file"
              continue
            fi

            # 判断输入格式：.txt / .list -> text，其余 -> yaml
            case "$file" in
              *.txt|*.list) informat="text" ;;
              *)            informat="yaml" ;;
            esac

            echo "处理: $file  [类型=$rtype, 格式=$informat] -> $out"

            # 复制到临时文件，避免 convert-ruleset 输入输出同目录时的潜在问题
            tmp_in="/tmp/$(basename "$file")"
            cp "$file" "$tmp_in"

            ./mihomocore convert-ruleset "$rtype" "$informat" "$tmp_in" "$out"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mihomo/rule/

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "Auto convert rules to MRS [skip ci]"
          git push

      - name: Cleanup
        run: |
          rm -f mihomo.gz mihomocore
