name: Merge Rules

on:
  push:
    paths:
      - "rules/merge/ChinaMax_Domain.yaml"
      - "rules/merge/ChinaMax_IP.yaml"
      - "rules/merge/DirectFix.yaml"
      - "rules/merge/Direct_IPFix.yaml"
      - ".github/workflows/merge_rules.py"
      - ".github/workflows/merge-rules.yml"

  workflow_run:
    workflows: ["Sync Mihomo Rule"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-push
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install pyyaml

      - name: Merge Domain
        run: |
          python .github/workflows/merge_rules.py \
            Direct Gavinuuup \
            rules/merge/ChinaMax_Domain.yaml \
            rules/merge/DirectFix.yaml \
            rules/domain/Direct.yaml

      - name: Merge IP
        run: |
          python .github/workflows/merge_rules.py \
            Direct_IP Gavinuuup \
            rules/merge/ChinaMax_IP.yaml \
            rules/merge/Direct_IPFix.yaml \
            rules/ip/Direct_IP.yaml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/domain/Direct.yaml rules/ip/Direct_IP.yaml
          if git diff --cached --quiet; then
            echo "No merged change"
            exit 0
          fi
          git commit -m "chore: rebuild Direct rules [$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push ok"
              exit 0
            fi
            echo "push failed, retry $i ..."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "push failed after retries"
          exit 1
