name: Sync Mihomo AI Rule

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download rule file
        run: |
          mkdir -p mihomo/rule
          
          # 尝试伪装完整的请求头拉取
          curl -sSL -A "clash.meta" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
            -o mihomo/rule/AI.yaml \
            "https://kelee.one/Tool/Clash/Rule/AI.yaml"

          # 校验：检查下载下来的文件是否是真正的 YAML（如果包含 <!DOCTYPE 文本则说明被拦截了）
          if grep -q "DOCTYPE html" mihomo/rule/AI.yaml || [ ! -s mihomo/rule/AI.yaml ]; then
            echo "Direct curl was blocked by Cloudflare! Trying mirror domain..."
            # kelee.one 的另一种备用域名/镜像地址
            curl -sSL -A "clash.meta" -o mihomo/rule/AI.yaml "https://rule.kelee.one/Clash/AI.yaml"
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mihomo/rule/AI.yaml
          
          if git diff --staged --quiet; then
            echo "规则没有变化，无需提交。"
          else
            # git commit -m "chore: 自动更新 mihomo AI 规则 [$(date +'%Y-%m-%d %H:%M:%S')]"
            git commit -m "chore: 自动更新 mihomo AI 规则 [$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')]"
            git push
          fi


