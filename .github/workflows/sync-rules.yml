name: Sync Mihomo Rule

permissions:
  contents: write

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: rules-push
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download rule file
        run: |
          wget -O rules/merge/ChinaMax_Domain.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml

          wget -O rules/merge/ChinaMax_IP.yaml \
            https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.yaml

      - name: Commit and push if changed
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add rules/merge/ChinaMax_Domain.yaml rules/merge/ChinaMax_IP.yaml

          if git diff --staged --quiet; then
            echo "规则没有变化，无需提交。"
            exit 0
          fi

          git commit -m "chore: 自动下载规则 [$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push ok"
              exit 0
            fi
            echo "push failed, retry $i ..."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "push failed after retries"
          exit 1
